<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mentoria para concursos militares e policiais: plano de estudos, conteúdo organizado por pastas e simulados na Área do aluno.">
<meta name="theme-color" content="#0c1526">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<title>Estude com Maicão | Mentoria para concursos militares e policiais</title>
<style>
:root{
  --ink:#0c1526;--ink-2:#1b2740;--ink-3:#3b496a;
  --paper:#f4f6fa;--card:#fff;
  --olive:#41521f;--olive-2:#5d7029;--olive-soft:#eff2e4;
  --brass:#c9922a;--brass-2:#eec25a;--brass-soft:#fbf3df;
  --mute:#5d6a85;--line:#e0e5ee;--line-2:#c9d2e0;
  --ok:#17724a;--ok-soft:#e7f4ed;--danger:#a81f16;--danger-soft:#fdecea;
  --r-lg:20px;--r:14px;--r-sm:10px;--pill:999px;
  --sh-1:0 1px 2px rgba(12,21,38,.05),0 10px 26px -14px rgba(12,21,38,.20);
  --sh-2:0 2px 6px rgba(12,21,38,.06),0 30px 60px -26px rgba(12,21,38,.35);
  --sh-3:0 18px 40px -18px rgba(12,21,38,.55);
  --max:1180px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font:16.5px/1.65 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);
  background:
    radial-gradient(1100px 520px at 88% -18%,#fff,rgba(255,255,255,0) 62%),
    linear-gradient(var(--line) 1px,transparent 1px) 0 0/30px 30px,
    linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/30px 30px,
    var(--paper);
  background-attachment:fixed;
  min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
h1,h2,h3,h4,.display,.btn,.seg-btn,.logo,.stat b,.step-n,.eyebrow,.tag,.badge,.pill{
  font-family:'Saira Condensed',Impact,'Arial Narrow',sans-serif;line-height:1.06}
h1{font-size:clamp(2.2rem,5.2vw,3.7rem);font-weight:700;text-transform:uppercase;letter-spacing:.005em}
h2{font-size:clamp(1.45rem,3vw,2.05rem);font-weight:700;text-transform:uppercase}
h3{font-size:1.16rem;font-weight:600}
p{max-width:70ch}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.muted{color:var(--mute)}
.small{font-size:.88rem}
.wrap{max-width:var(--max);margin:0 auto;padding:0 max(22px,env(safe-area-inset-left)) 0 max(22px,env(safe-area-inset-right))}
.row{display:flex;align-items:center;gap:10px}
.ico{display:inline-flex;align-items:center;justify-content:center;width:1.15em;height:1.15em;flex:0 0 auto}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.fill svg{fill:currentColor;stroke:none}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.sec{padding:76px 0}
.sec-head{max-width:62ch;margin-bottom:34px}
.sec-head h2{margin:10px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card.pad{padding:26px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:var(--pill);background:var(--olive-soft);color:var(--olive);font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;border:1px solid rgba(65,82,31,.16)}
.badge.gold{background:var(--brass-soft);color:#8a6413;border-color:rgba(201,146,42,.28)}
.badge.new{background:var(--brass);color:#3d2a05;border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--pill);font-size:.8rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line-2);background:#fff;color:var(--ink-3)}
.pill.ok{background:var(--ok-soft);border-color:rgba(23,114,74,.22);color:var(--ok)}
.pill.off{background:var(--danger-soft);border-color:rgba(168,31,22,.2);color:var(--danger)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 26px;border:0;border-radius:var(--pill);cursor:pointer;font:600 1.02rem/1 'Saira Condensed',sans-serif;
  letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(170deg,var(--olive-2),var(--olive));
  box-shadow:0 10px 22px -12px rgba(65,82,31,.85);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
  text-align:center;white-space:nowrap;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(65,82,31,.9)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.gold{background:linear-gradient(170deg,var(--brass-2),var(--brass));color:#3a2708;box-shadow:0 10px 22px -12px rgba(201,146,42,.95)}
.btn.gold:hover{box-shadow:0 16px 32px -14px rgba(201,146,42,1)}
.btn.dark{background:linear-gradient(170deg,var(--ink-2),var(--ink));color:#fff;box-shadow:0 10px 22px -14px rgba(12,21,38,.9)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink);box-shadow:var(--sh-1)}
.btn.danger{background:linear-gradient(170deg,#c9302a,var(--danger));box-shadow:0 10px 22px -14px rgba(168,31,22,.9)}
.btn.sm{padding:10px 16px;font-size:.86rem;letter-spacing:.09em}
.btn.block{width:100%}
.btn[disabled]{opacity:.62;cursor:not-allowed;transform:none;box-shadow:none}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--olive);font:600 .95rem 'IBM Plex Sans',sans-serif;text-decoration:underline;text-underline-offset:3px}
.field{display:grid;gap:7px}
.field>span{font:600 .78rem/1 'IBM Plex Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
input,select,textarea{
  width:100%;padding:13px 15px;background:#fff;border:1.5px solid var(--line-2);border-radius:var(--r-sm);
  font:inherit;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease;
}
input::placeholder{color:#9aa5bb}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 4px rgba(201,146,42,.28)}
.ig{position:relative;display:flex;align-items:center}
.ig input{padding-right:52px}
.ig-btn{position:absolute;right:6px;width:40px;height:40px;border:0;border-radius:9px;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center}
.ig-btn:hover{background:var(--paper);color:var(--ink)}
.ig-btn .ico{width:19px;height:19px}
.err{color:var(--danger);font-size:.92rem;min-height:1.35em;display:flex;align-items:center;gap:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.top{position:-webkit-sticky;position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:13px;padding-bottom:13px}
.brand{display:inline-flex;align-items:center;gap:11px;font:700 1.22rem/1 'Saira Condensed',sans-serif;text-transform:uppercase;letter-spacing:.07em}
.brand-mark{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(160deg,var(--ink-2),var(--ink));color:var(--brass-2);box-shadow:0 10px 20px -12px rgba(12,21,38,.95)}
.brand-mark .ico{width:21px;height:21px}
.nav{display:flex;align-items:center;gap:26px}
.nav a{font:500 .94rem/1 'IBM Plex Sans',sans-serif;color:var(--ink-3);padding:6px 0;position:relative}
.nav a::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--brass);transition:width .22s ease}
.nav a:hover{color:var(--ink)}
.nav a:hover::after{width:100%}
.nav-actions{display:flex;align-items:center;gap:12px}
.menu-btn{display:none;width:42px;height:42px;border:1px solid var(--line-2);background:#fff;border-radius:11px;color:var(--ink);cursor:pointer;place-items:center}
.menu-btn .ico{width:20px;height:20px}
.hero{position:relative;overflow:hidden;background:linear-gradient(155deg,#0a1322 0%,#152340 58%,#1e3054 100%);color:#eef2f9;padding:76px 0 96px}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:radial-gradient(760px 420px at 72% 24%,#000,transparent 78%);mask-image:radial-gradient(760px 420px at 72% 24%,#000,transparent 78%)}
.hero::after{content:'';position:absolute;width:560px;height:560px;right:-160px;top:-190px;border-radius:50%;background:radial-gradient(circle,rgba(238,194,90,.34),rgba(238,194,90,0) 62%)}
.hero .wrap{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:56px;align-items:center}
.hero h1{color:#fff;max-width:22ch}
.hero .eyebrow{color:var(--brass-2)}
.hero-lead{margin:18px 0 26px;font-size:1.08rem;color:#c4cfe2}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px}
.hero-points{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:30px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);list-style:none;padding-left:0}
.hero-points li{display:flex;align-items:center;gap:9px;font-size:.93rem;color:#d7e0ef}
.hero-points .ico{width:18px;height:18px;color:var(--brass-2)}
.video-card{position:relative;border-radius:var(--r-lg);background:#fff;padding:12px;box-shadow:var(--sh-3)}
.video{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:linear-gradient(150deg,#0f1c33,#22355a);display:grid;place-items:center;text-align:center;color:#ccd7ea}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-ph{display:grid;gap:10px;place-items:center;padding:22px}
.video-ph b{font:600 1.15rem 'Saira Condensed';text-transform:uppercase;letter-spacing:.06em;color:#fff}
.video-ph small{color:#a9b7ce}
.video-ph .play{width:62px;height:62px;border-radius:50%;background:linear-gradient(170deg,var(--brass-2),var(--brass));color:#3a2708;display:grid;place-items:center;box-shadow:0 18px 36px -14px rgba(201,146,42,.95)}
.video-ph .play .ico{width:26px;height:26px}
.video-tag{position:absolute;left:-12px;bottom:24px;background:#fff;color:var(--ink);border-radius:var(--pill);padding:10px 18px;box-shadow:var(--sh-2);display:flex;align-items:center;gap:9px;font:500 .88rem 'IBM Plex Sans'}
.video-tag .ico{color:var(--ok)}
.strip{margin-top:-48px;position:relative;z-index:2}
.strip-inner{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-2);overflow:hidden}
.strip-item{display:flex;gap:14px;align-items:center;padding:20px 22px;border-right:1px solid var(--line)}
.strip-item:last-child{border-right:0}
.strip-item .ico{width:38px;height:38px;padding:9px;border-radius:12px;background:var(--olive-soft);color:var(--olive)}
.strip-item b{display:block;font:600 1rem 'Saira Condensed';text-transform:uppercase;letter-spacing:.06em}
.strip-item small{color:var(--mute);font-size:.88rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;list-style:none;padding:0}
.step{position:relative;padding:30px 26px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}
.step:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.step-n{position:absolute;right:20px;top:10px;font-size:3.1rem;font-weight:700;color:var(--olive-soft);line-height:1}
.step-ico{width:44px;height:44px;border-radius:13px;background:linear-gradient(160deg,var(--olive-2),var(--olive));color:#fff;display:grid;place-items:center;margin-bottom:16px;box-shadow:0 12px 24px -14px rgba(65,82,31,.95)}
.step-ico .ico{width:22px;height:22px}
.step h3{margin-bottom:7px}
.step p{color:var(--mute);font-size:.96rem}
.grid-folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:20px}
.folder{display:grid;gap:5px;text-align:left;padding:22px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);color:var(--ink);font:inherit;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.folder:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.folder-top{display:flex;align-items:center;justify-content:space-between}
.folder-ico{width:46px;height:46px;border-radius:14px;background:var(--olive-soft);color:var(--olive);display:grid;place-items:center}
.folder-ico .ico{width:23px;height:23px}
.folder b{font:600 1.26rem 'Saira Condensed';text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
.folder small{color:var(--mute)}
.folder .go{color:var(--line-2);transition:color .2s,transform .2s}
.folder:hover .go{color:var(--brass);transform:translateX(3px)}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:20px}
.feat{padding:26px;border:1px solid var(--line);border-radius:var(--r);background:#fff;box-shadow:var(--sh-1)}
.feat .ico{width:40px;height:40px;padding:10px;border-radius:12px;background:var(--brass-soft);color:#8a6413;margin-bottom:15px}
.feat h3{margin-bottom:6px}
.feat p{color:var(--mute);font-size:.95rem}
.panel{position:relative;overflow:hidden;background:linear-gradient(160deg,#0d1729,#17253f);color:#e9eef8;border-radius:var(--r-lg);padding:46px;box-shadow:var(--sh-2)}
.panel::after{content:'';position:absolute;width:420px;height:420px;right:-150px;bottom:-200px;border-radius:50%;background:radial-gradient(circle,rgba(238,194,90,.26),transparent 64%)}
.panel>*{position:relative;z-index:1}
.panel h2{color:#fff}
.panel p{color:#c3cee2}
.panel .chip-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.panel .chip-list span{padding:8px 16px;border-radius:var(--pill);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.17);font-size:.88rem}
.faq{display:grid;gap:12px}
.faq-item{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-1);overflow:hidden}
.faq-item summary{list-style:none;cursor:pointer;padding:19px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-weight:500}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary .ico{color:var(--mute);transition:transform .2s ease,color .2s ease}
.faq-item[open] summary .ico{transform:rotate(45deg);color:var(--brass)}
.faq-item p{padding:0 22px 20px;color:var(--mute);font-size:.96rem}
.cta-band{position:relative;overflow:hidden;background:linear-gradient(155deg,var(--olive),#2c3914);color:#fff;border-radius:var(--r-lg);padding:54px 44px;text-align:center;box-shadow:var(--sh-2)}
.cta-band::after{content:'';position:absolute;width:460px;height:460px;left:-160px;top:-220px;border-radius:50%;background:radial-gradient(circle,rgba(238,194,90,.22),transparent 62%)}
.cta-band>*{position:relative;z-index:1}
.cta-band h2{color:#fff}
.cta-band p{margin:14px auto 28px;color:#e2e9d4;max-width:54ch}
.cta-band .hero-cta{justify-content:center}
.foot{margin-top:84px;background:#0a1322;color:#aebbd2;padding:58px 0 calc(26px + env(safe-area-inset-bottom,0px))}
.foot-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:32px}
.foot h4{color:#fff;font:600 .82rem 'Saira Condensed';letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px}
.foot a{display:block;padding:5px 0;color:#aebbd2;font-size:.94rem}
.foot a:hover{color:#fff}
.foot .brand{color:#fff;margin-bottom:14px}
.foot p{font-size:.94rem;max-width:38ch}
.foot-bottom{margin-top:36px;padding-top:20px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:.85rem}
.fab{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:50;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(170deg,#2ec26a,#199150);color:#fff;box-shadow:0 20px 36px -16px rgba(23,114,74,.98);transition:transform .2s ease}
.fab:hover{transform:scale(1.07)}
.fab .ico{width:29px;height:29px}
.auth{display:grid;grid-template-columns:1.02fr .98fr;min-height:100vh;min-height:100dvh}
.auth-aside{position:relative;overflow:hidden;background:linear-gradient(160deg,#0a1322,#1a2947 72%);color:#e9eef8;padding:52px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.auth-aside::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:32px 32px;-webkit-mask-image:radial-gradient(520px 420px at 70% 20%,#000,transparent 76%);mask-image:radial-gradient(520px 420px at 70% 20%,#000,transparent 76%)}
.auth-aside>*{position:relative;z-index:1}
.auth-aside .eyebrow{color:var(--brass-2)}
.auth-aside h2{font-size:clamp(1.75rem,3vw,2.4rem);color:#fff;margin:12px 0 14px;max-width:18ch}
.auth-points{list-style:none;padding:0;display:grid;gap:14px}
.auth-points li{display:flex;gap:12px;align-items:flex-start;color:#cbd6e8;font-size:.97rem}
.auth-points .ico{width:27px;height:27px;padding:5px;border-radius:8px;background:rgba(238,194,90,.16);color:var(--brass-2);margin-top:1px}
.auth-quote{border-left:3px solid var(--brass);padding-left:16px;color:#bac7dd;font-size:.95rem}
.auth-panel{display:grid;place-items:center;padding:44px 26px}
.auth-card{width:100%;max-width:442px;padding:34px}
.auth-card h1{font-size:2.1rem;margin-bottom:6px}
.auth-card .muted{margin-bottom:20px;font-size:.95rem}
.auth-foot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--mute)}
.hint{font-size:.83rem;color:var(--mute);text-align:center;margin-top:16px}
.page{padding:46px 0 84px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.page-head h1{font-size:clamp(1.85rem,3.6vw,2.6rem)}
.page-head .muted{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:16px;margin-bottom:28px}
.stat{display:flex;align-items:center;gap:14px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.stat .ico{width:42px;height:42px;padding:10px;border-radius:12px;background:var(--olive-soft);color:var(--olive)}
.stat.ok .ico{background:var(--ok-soft);color:var(--ok)}
.stat.off .ico{background:var(--danger-soft);color:var(--danger)}
.stat.gold .ico{background:var(--brass-soft);color:#8a6413}
.stat b{display:block;font-size:1.8rem;line-height:1}
.stat small{color:var(--mute);font-size:.86rem}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.toolbar .ig{flex:1;min-width:250px}
.crumb{display:flex;align-items:center;gap:10px;margin-bottom:18px;color:var(--mute);font-size:.92rem;flex-wrap:wrap}
.crumb b{color:var(--ink)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-1);font:inherit;color:var(--ink);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.item:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.item-ico{width:42px;height:42px;border-radius:12px;background:var(--olive-soft);color:var(--olive);display:grid;place-items:center;flex:0 0 auto}
.item-ico .ico{width:20px;height:20px}
.item-txt{flex:1;display:grid;min-width:0}
.item-txt b{font:600 1.04rem 'Saira Condensed';text-transform:uppercase;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-txt small{color:var(--mute);font-size:.87rem}
.item-go{color:var(--line-2);flex:0 0 auto}
.item:hover .item-go{color:var(--brass)}
.empty{text-align:center;padding:48px 22px;border:1.5px dashed var(--line-2);border-radius:var(--r);color:var(--mute);background:rgba(255,255,255,.65)}
.empty .ico{width:36px;height:36px;margin:0 auto 12px;color:var(--line-2);display:block}
.empty b{display:block;color:var(--ink);font:600 1.12rem 'Saira Condensed';text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.seg{display:inline-flex;padding:5px;gap:4px;background:#fff;border:1px solid var(--line-2);border-radius:var(--pill);box-shadow:var(--sh-1)}
.seg-btn{display:inline-flex;align-items:center;gap:9px;padding:10px 22px;border:0;border-radius:var(--pill);background:transparent;cursor:pointer;font:600 .96rem 'Saira Condensed';letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);transition:background .2s ease,color .2s ease}
.seg-btn .ico{width:17px;height:17px}
.seg-btn:hover{color:var(--ink)}
.seg-btn.on{background:linear-gradient(170deg,var(--ink-2),var(--ink));color:#fff;box-shadow:0 10px 20px -14px rgba(12,21,38,.95)}
.seg.wide{display:grid;grid-template-columns:1fr 1fr;width:100%;margin-bottom:28px}
.seg.wide .seg-btn{justify-content:center}
.grid-2{display:grid;grid-template-columns:1.45fr 1fr;gap:20px;margin-bottom:22px}
.list{list-style:none;padding:0;display:grid;gap:10px}
.list li{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-1)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:8px 10px 8px 15px;background:#fff;border:1px solid var(--line-2);border-radius:var(--pill);font-size:.92rem;box-shadow:var(--sh-1)}
.chip .ico{width:17px;height:17px;color:var(--olive)}
.chip small{color:var(--mute)}
.icon-btn{width:37px;height:37px;border-radius:11px;border:1px solid var(--line-2);background:#fff;color:var(--ink-3);cursor:pointer;display:grid;place-items:center;transition:border-color .18s ease,color .18s ease,background .18s ease}
.icon-btn .ico{width:17px;height:17px}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}
.icon-btn.danger:hover{background:var(--danger-soft);border-color:rgba(168,31,22,.35);color:var(--danger)}
.icon-btn.sm{width:27px;height:27px;border-radius:8px}
.icon-btn.sm .ico{width:14px;height:14px}
.row-actions{display:flex;gap:8px}
.ov{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
table{width:100%;border-collapse:collapse;background:#fff;min-width:600px}
th{font:600 .76rem/1 'IBM Plex Sans';letter-spacing:.13em;text-transform:uppercase;color:var(--mute);text-align:left;padding:14px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfe}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(170deg,var(--olive-2),var(--olive));color:#fff;font:700 .96rem 'Saira Condensed';letter-spacing:.05em}
.who b{display:block}
.who small{color:var(--mute);font-size:.86rem}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.card-head h2{margin:0}
.card-head .ig{min-width:230px}
.card-head .row{gap:12px}
.dz{grid-column:1/-1;display:flex;align-items:center;gap:15px;padding:20px;border:1.5px dashed var(--line-2);border-radius:var(--r-sm);background:#fbfcfe;cursor:pointer;transition:border-color .18s ease,background .18s ease}
.dz:hover,.dz.over{border-color:var(--brass);background:var(--brass-soft)}
.dz .ico{width:40px;height:40px;padding:10px;border-radius:12px;background:#fff;color:var(--olive);border:1px solid var(--line)}
.dz b{display:block;font:600 1rem 'Saira Condensed';text-transform:uppercase;letter-spacing:.06em}
.dz small{color:var(--mute);display:block}
.dz-nome{color:var(--olive);font-size:.9rem;margin-left:auto;text-align:right}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:16px;align-items:end}
.field.wide,.span-all{grid-column:1/-1}
.form .btn{justify-self:start}
.modal{position:fixed;inset:0;z-index:80;background:rgba(8,15,28,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:22px}
.modal-card{width:100%;max-width:450px;background:#fff;border-radius:var(--r-lg);padding:28px;box-shadow:var(--sh-2);animation:pop .2s ease}
.modal-card h3{font-size:1.32rem;text-transform:uppercase;margin-bottom:8px}
.modal-card .muted{margin-bottom:18px;font-size:.94rem}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.toasts{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:10px;max-width:min(370px,90vw)}
.toast{display:flex;align-items:flex-start;gap:11px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:var(--r-sm);box-shadow:var(--sh-2);opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .25s ease}
.toast.in{opacity:1;transform:none}
.toast.erro{border-left-color:var(--danger)}
.toast .ico{width:19px;height:19px;color:var(--ok);margin-top:2px}
.toast.erro .ico{color:var(--danger)}
@media(max-width:1000px){
  .hero-grid{grid-template-columns:1fr;gap:40px}
  .hero{padding:56px 0 84px}
  .auth{grid-template-columns:1fr}
  .auth-panel{order:-1;padding:34px 20px}
  .auth-aside{order:2;padding:38px 26px;gap:24px}
  .auth-aside h2{max-width:26ch}
  .grid-2{grid-template-columns:1fr}
  .foot-grid{grid-template-columns:1fr 1fr}
  .nav{display:none}
  .nav.open{display:flex;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:flex-start;gap:6px;padding:18px 22px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--sh-2)}
  .nav.open a{padding:9px 0;width:100%}
  .menu-btn{display:grid}
}
@media(max-width:820px){
  .steps{grid-template-columns:1fr}
  .strip-inner{grid-template-columns:1fr}
  .strip-item{border-right:0;border-bottom:1px solid var(--line)}
  .strip-item:last-child{border-bottom:0}
  .strip{margin-top:-36px}
  .grid-2,.form{grid-template-columns:1fr}
  .panel,.cta-band{padding:34px 24px}
  .seg.wide{grid-template-columns:1fr}
  .page-head h1{font-size:1.9rem}
}
@media(max-width:560px){
  body{font-size:16px}
  .wrap{padding-left:16px;padding-right:16px}
  .sec{padding:56px 0}
  .hero-cta .btn{width:100%}
  .grid-folders{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .auth-card{padding:26px 22px}
  .toasts{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:none}
  .fab{bottom:calc(16px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px))}
  .foot-grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>

<!-- ===== Página: login ===== -->
<template id="tpl-login">

        <li><span class="ico" data-ico="check"></span><span>Simulados em formato de prova para treinar o ritmo.</span></li>
        <li><span class="ico" data-ico="check"></span><span>Acesso em celular, tablet e computador.</span></li>
      </ul>

      <h1>Estude para a farda com plano, cobrança e direção.</h1>
      <p class="hero-lead">A mentoria certa para quem quer parar de estudar no escuro: conteúdo organizado por matérias, simulados em formato de prova e acompanhamento de quem já passou por isso.</p>

      <div class="folder" style="cursor:default"><div class="folder-top"><span class="folder-ico"><span class="ico" data-ico="layers"></span></span></div><b>Simulados</b><small>Treino em formato de prova</small></div>
      <div class="folder" style="cursor:default"><div class="folder-top"><span class="folder-ico"><span class="ico" data-ico="shield"></span></span></div><b>Noções de Direito</b><small>Conteúdo jurídico das provas</small></div>

/* ---------- utilitários e armazenamento ----------
   Em alguns navegadores (principalmente abrindo o arquivo direto no iPhone)

const L=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?(MEM[k]??d):JSON.parse(v)}catch(e){return MEM[k]??d}};

const sha=async t=>{
  try{
    if(crypto&&crypto.subtle)return [...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){}
  return 'p:'+t;
};
const idb=()=>new Promise((r,j)=>{try{const q=indexedDB.open('plataforma',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}catch(e){j(e)}});
const fput=async(k,b)=>{const d=await idb();return new Promise((r,j)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(b,k);t.oncomplete=r;t.onerror=()=>j(t.error)})};
const fget=async k=>{const d=await idb();return new Promise((r,j)=>{try{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)}catch(e){j(e)}})};
const fdel=async k=>{try{(await idb()).transaction('f','readwrite').objectStore('f').delete(k)}catch(e){}};
const ses=()=>{try{return JSON.parse(SS.get('s')||'null')}catch(e){return null}};

/* ---------- componentes de interface ---------- */
function toast(msg,tipo){
  const box=$('#toasts'),el=document.createElement('div');
  el.className='toast '+(tipo==='erro'?'erro':'');
  el.innerHTML=icon(tipo==='erro'?'alert':'check')+'<span>'+esc(msg)+'</span>';
  box.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('in'));
  setTimeout(()=>{el.classList.remove('in');setTimeout(()=>el.remove(),280)},3400);
}

function modal(o){
  return new Promise(res=>{
    const m=$('#modal');m.hidden=false;
    let h='<div class="modal-card" role="dialog" aria-modal="true"><h3>'+esc(o.titulo)+'</h3>';
    if(o.texto)h+='<p class="muted">'+esc(o.texto)+'</p>';
    if(o.label)h+='<label class="field"><span>'+esc(o.label)+'</span><input id="mv" type="'+(o.tipo||'text')+'"'+(o.min?' minlength="'+o.min+'"':'')+' autocomplete="off"></label>';
    h+='<div class="modal-actions"><button type="button" class="btn ghost sm" id="mc">'+esc(o.cancelar||'Cancelar')+'</button><button type="button" class="btn sm'+(o.perigo?' danger':'')+'" id="mo">'+esc(o.ok||'Confirmar')+'</button></div></div>';
    m.innerHTML=h;
    const key=e=>{if(e.key==='Escape')fin(null)};
    const fin=v=>{m.hidden=true;m.innerHTML='';document.removeEventListener('keydown',key);res(v)};
    document.addEventListener('keydown',key);
    const inp=$('#mv');
    if(inp){
      inp.focus();
      inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();fin(inp.value.trim())}};
      $('#mo').onclick=()=>fin(inp.value.trim());
    }else $('#mo').onclick=()=>fin(true);
    $('#mc').onclick=()=>fin(null);
    m.onclick=e=>{if(e.target===m)fin(null)};
  });
}
const confirma=(titulo,texto,ok)=>modal({titulo,texto,ok:ok||'Excluir',perigo:true}).then(v=>!!v);

function carregando(btn,texto,fn){
  return async e=>{
    e.preventDefault();
    const antes=btn.innerHTML;
    btn.disabled=true;btn.innerHTML=esc(texto);
    try{await fn(e)}finally{btn.disabled=false;btn.innerHTML=antes}
  };
}

    g.innerHTML=ps.length?ps.map(p=>{
      const n=it.filter(i=>i.pasta===p.id).length;
      return '<button class="folder" data-id="'+p.id+'"><span class="folder-top"><span class="folder-ico">'+icon('folder')+'</span><span class="go">'+icon('chevron')+'</span></span><b>'+esc(p.nome)+'</b><small>'+n+(n===1?' conteúdo':' conteúdos')+'</small></button>';
    }).join(''):'<div class="empty">'+icon('folder')+'<b>Nenhuma pasta ainda</b><p>Assim que o mentor publicar conteúdo, ele aparece aqui.</p></div>';
  };
  const lista=(titulo,html,cr)=>{
    g.hidden=true;v.hidden=false;
    crumb.hidden=!cr;crumb.innerHTML=cr||'';
    v.innerHTML='<div class="list-head"><h2>'+esc(titulo)+'</h2></div>'+html;
    const vo=$('#vo');if(vo)vo.onclick=pastas;
    window.scrollTo({top:0,behavior:'smooth'});
  };
  const abrirPasta=id=>{
    const p=ps.find(x=>x.id===id);if(!p)return;
    const xs=itens().filter(i=>i.pasta===id);
    lista(p.nome,
      xs.length?xs.map(linha).join(''):'<div class="empty">'+icon('layers')+'<b>Pasta vazia</b><p>O mentor ainda não publicou conteúdo nesta pasta.</p></div>',
      '<button class="link" id="vo">'+icon('chevron')+' Todas as pastas</button><span>›</span><b>'+esc(p.nome)+'</b>');
  };
  g.onclick=e=>{const b=e.target.closest('.folder');if(b)abrirPasta(b.dataset.id)};
  v.onclick=e=>{
    const b=e.target.closest('.item');if(!b)return;
    const i=itens().find(x=>x.id===b.dataset.id);if(!i)return;
    marcarVisto(u.id,i.id);stats();
    if(i.url)return window.open(i.url,'_blank','noopener');
    const w=window.open('','_blank');
    fget(i.fid).then(f=>{
      if(!f){if(w)w.document.write('<p style="font:16px system-ui,sans-serif;padding:28px">Arquivo não encontrado. Peça ao mentor para publicar novamente.</p>');return toast('Arquivo não encontrado.','erro')}
      w.location=URL.createObjectURL(f);
    }).catch(()=>toast('Não foi possível abrir o arquivo neste navegador.','erro'));
  };
  $('#busca').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    if(!q)return pastas();
    const r=itens().filter(i=>i.titulo.toLowerCase().includes(q));
    lista(r.length?r.length+' resultado(s) para "'+q+'"':'Nada encontrado',
      r.length?r.map(linha).join(''):'<div class="empty">'+icon('search')+'<b>Nenhum conteúdo com esse nome</b><p>Tente buscar por outra palavra.</p></div>',
      '<button class="link" id="vo">'+icon('chevron')+' Todas as pastas</button><span>›</span><b>Busca</b>');
  };
  $('#atualizar').onclick=()=>{stats();pastas();toast('Lista atualizada.')};
  stats();pastas();
};

/* ===================== Página: administrador ===================== */
P.admin=()=>{
  guard('admin');
  $('#sair').onclick=sair;
  const secA=$('#t-a'),secC=$('#t-c'),app=$('#app');
  $$('.seg-btn').forEach(t=>t.onclick=()=>{
    $$('.seg-btn').forEach(x=>{const on=x===t;x.classList.toggle('on',on);x.setAttribute('aria-selected',on?'true':'false')});
    const a=t.dataset.t==='a';secA.hidden=!a;secC.hidden=a;
  });

  const R=()=>{
    const us=L('users',[]),al=us.filter(u=>u.role==='aluno'),ps=L('pastas',[]),it=L('itens',[]);
    $('#s-alunos').textContent=al.length;
    $('#s-ativos').textContent=al.filter(u=>u.ativo).length;
    $('#s-bloq').textContent=al.filter(u=>!u.ativo).length;
    $('#s-pastas').textContent=ps.length;
    $('#s-itens').textContent=it.length;
    $('#b-alunos').textContent=al.length+(al.length===1?' aluno':' alunos');
    $('#b-itens').textContent=it.length+(it.length===1?' conteúdo':' conteúdos');
    const q=($('#ba').value||'').trim().toLowerCase();
    const vis=al.filter(u=>!q||u.nome.toLowerCase().includes(q)||u.login.includes(q));
    $('#ta').innerHTML=vis.length?vis.map(u=>
      '<tr><td><span class="who"><span class="avatar">'+esc((u.nome.trim()[0]||'?').toUpperCase())+'</span><span><b>'+esc(u.nome)+'</b><small>'+esc(u.login)+'</small></span></span></td>'
      +'<td><span class="pill '+(u.ativo?'ok':'off')+'">'+(u.ativo?'Ativo':'Bloqueado')+'</span></td>'
      +'<td><div class="row-actions">'
      +'<button class="icon-btn" data-a="blk" data-id="'+u.id+'" title="'+(u.ativo?'Bloquear acesso':'Liberar acesso')+'" aria-label="'+(u.ativo?'Bloquear acesso':'Liberar acesso')+'">'+icon(u.ativo?'ban':'check')+'</button>'
      +'<button class="icon-btn" data-a="pw" data-id="'+u.id+'" title="Definir nova senha" aria-label="Definir nova senha">'+icon('key')+'</button>'
      +'<button class="icon-btn danger" data-a="del" data-id="'+u.id+'" title="Excluir aluno" aria-label="Excluir aluno">'+icon('trash')+'</button>'
      +'</div></td></tr>').join('')
      :'<tr><td colspan="3"><div class="empty">'+icon('users')+'<b>Nenhum aluno encontrado</b><p>Cadastre um aluno no formulário acima para liberar o acesso à Área do aluno.</p></div></td></tr>';
    $('#cp').innerHTML=ps.length?ps.map(p=>'<option value="'+p.id+'">'+esc(p.nome)+'</option>').join(''):'<option value="">Crie uma pasta primeiro</option>';
    $('#cp').disabled=!ps.length;
    $('#pl').innerHTML=ps.length?ps.map(p=>
      '<span class="chip">'+icon('folder')+esc(p.nome)+'<small>'+it.filter(i=>i.pasta===p.id).length+'</small><button class="icon-btn sm danger" data-a="dp" data-id="'+p.id+'" title="Excluir pasta" aria-label="Excluir pasta '+esc(p.nome)+'">'+icon('close')+'</button></span>').join('')
      :'<p class="muted small">Nenhuma pasta criada ainda. Crie a primeira abaixo.</p>';
    $('#il').innerHTML=it.length?it.map(i=>
      '<li><span class="item-ico">'+icon(i.url?'link':'file')+'</span>'
      +'<span class="item-txt"><b>'+esc(i.titulo)+'</b><small>'+esc((ps.find(p=>p.id===i.pasta)||{}).nome||'Sem pasta')+' · '+(i.url?'Link externo':(i.tamanho?bytes(i.tamanho):'Arquivo'))+'</small></span>'
      +'<button class="icon-btn danger" data-a="di" data-id="'+i.id+'" title="Excluir conteúdo" aria-label="Excluir conteúdo">'+icon('trash')+'</button></li>').join('')
      :'<li class="empty-li">Nenhum conteúdo publicado ainda. Publique o primeiro no formulário acima.</li>';
  };

  app.onclick=async e=>{
    const b=e.target.closest('[data-a]');if(!b)return;
    const a=b.dataset.a,id=b.dataset.id;
    const us=L('users',[]);
    if(a==='blk'){
      const u=us.find(x=>x.id===id);if(!u)return;
      u.ativo=u.ativo?0:1;S('users',us);
      toast(u.ativo?('Acesso liberado para '+u.nome+'.'):('Acesso bloqueado para '+u.nome+'.'),u.ativo?'ok':'erro');
    }
    if(a==='pw'){
      const n=await modal({titulo:'Nova senha',texto:'O aluno passará a entrar com a senha definida aqui.',label:'Nova senha',ok:'Salvar senha',min:6});
      if(n===null)return;
      if(!n||n.length<6)return toast('A senha precisa de pelo menos 6 caracteres.','erro');
      us.find(x=>x.id===id).senha=await sha(n);S('users',us);
      toast('Senha atualizada com sucesso.');
    }
    if(a==='del'){
      const u=us.find(x=>x.id===id);
      if(!await confirma('Excluir aluno','O acesso de "'+((u&&u.nome)||'')+'" será removido. Esta ação não pode ser desfeita.','Excluir aluno'))return;
      S('users',us.filter(x=>x.id!==id));toast('Aluno excluído.');
    }
    if(a==='dp'){
      const p=L('pastas',[]).find(x=>x.id===id);
      if(!await confirma('Excluir pasta','Todo o conteúdo de "'+((p&&p.nome)||'')+'" será apagado da Área do aluno.','Excluir pasta'))return;
      L('itens',[]).filter(i=>i.pasta===id&&i.fid).forEach(i=>fdel(i.fid));
      S('itens',L('itens',[]).filter(i=>i.pasta!==id));
      S('pastas',L('pastas',[]).filter(x=>x.id!==id));
      toast('Pasta e conteúdo excluídos.');
    }
    if(a==='di'){
      if(!await confirma('Excluir conteúdo','O item deixará de aparecer para os alunos.','Excluir conteúdo'))return;
      const i=L('itens',[]).find(x=>x.id===id);
      if(i&&i.fid)fdel(i.fid);
      S('itens',L('itens',[]).filter(x=>x.id!==id));
      toast('Conteúdo excluído.');
    }
    R();
  };

  $('#fa').onsubmit=carregando($('#fa button'),'Cadastrando…',async e=>{
    const l=$('#al').value.trim().toLowerCase(),us=L('users',[]);
    if(!/^[a-z0-9._-]+$/.test(l))return toast('Use apenas letras, números, ponto, hífen ou _ no login.','erro');
    if(us.some(u=>u.login===l))return toast('Esse login já existe. Escolha outro.','erro');
    us.push({id:uid(),nome:$('#an').value.trim(),login:l,senha:await sha($('#as').value),role:'aluno',ativo:1});
    S('users',us);e.target.reset();R();
    toast('Aluno cadastrado. Já pode entrar com o login "'+l+'".');
  });

  $('#fp').onsubmit=carregando($('#fp button'),'Criando…',async e=>{
    const nome=$('#pn').value.trim();
    if(L('pastas',[]).some(p=>p.nome.toLowerCase()===nome.toLowerCase()))return toast('Já existe uma pasta com esse nome.','erro');
    S('pastas',[...L('pastas',[]),{id:uid(),nome}]);e.target.reset();R();
    toast('Pasta "'+nome+'" criada.');
  });

  const dz=$('#dz'),cf=$('#cf');
  const nomeArq=()=>{const f=cf.files[0];$('#dz-nome').textContent=f?f.name+' · '+bytes(f.size):''};
  dz.onclick=()=>cf.click();
  dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cf.click()}};
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files&&e.dataTransfer.files[0]){cf.files=e.dataTransfer.files;nomeArq()}};
  cf.onchange=nomeArq;

  $('#fc').onsubmit=carregando($('#fc button'),'Publicando…',async e=>{
    if($('#cp').disabled)return toast('Crie uma pasta antes de publicar.','erro');
    const f=cf.files[0],url=$('#cu').value.trim();
    if(!url&&!f)return toast('Informe um link ou escolha um arquivo.','erro');
    const i={id:uid(),pasta:$('#cp').value,titulo:$('#ct').value.trim()};
    if(url)i.url=url;
    else{
      i.fid=uid();
      try{await fput(i.fid,f);i.tamanho=f.size}
      catch(err){return toast('Não foi possível salvar o arquivo neste navegador. Use um link ou abra a plataforma por um servidor.','erro')}
    }
    S('itens',[...L('itens',[]),i]);
    e.target.reset();$('#dz-nome').textContent='';R();
    toast('Conteúdo publicado em "'+((L('pastas',[]).find(p=>p.id===i.pasta)||{}).nome||'')+'".');
  });

  $('#ba').oninput=R;
  $('#pwa').onclick=async()=>{
    const n=await modal({titulo:'Minha senha',texto:'Defina a nova senha usada para acessar este painel.',label:'Nova senha',ok:'Salvar senha',min:6});
    if(n===null)return;
    if(!n||n.length<6)return toast('A senha precisa de pelo menos 6 caracteres.','erro');
    const us=L('users',[]);us.find(u=>u.role==='admin').senha=await sha(n);S('users',us);
    toast('Senha do administrador atualizada.');
  };

  R();
};

/* ===================== Roteador (arquivo único) ===================== */
const TITLES={
  matricula:'Estude com Maicão | Mentoria para concursos militares e policiais',
  login:'Entrar | Área do aluno — Estude com Maicão',
  aluno:'Área do aluno | Estude com Maicão',
  admin:'Painel do administrador | Estude com Maicão'
};
const ROUTES=['matricula','login','aluno','admin'];
function router(){
  const r=location.hash.replace('#','')||'matricula';
  const page=ROUTES.includes(r)?r:'matricula';
  const app=$('#app');
  app.onclick=null;
  app.innerHTML=document.getElementById('tpl-'+page).innerHTML;
  document.title=TITLES[page];
  $$('#app [data-ico]').forEach(el=>{el.classList.add('ico');const n=el.dataset.ico;el.innerHTML=ICON[n]?svg(ICON[n]):''});
  $$('#app .wa').forEach(a=>a.href=CFG.wa);
  window.scrollTo(0,0);
  try{P[page]()}catch(e){if(e!==0)console.error(e)}
}
window.addEventListener('hashchange',router);
seed().catch(()=>{}).then(()=>{
  router();
  if(!PERSISTE)toast('Este navegador bloqueou o armazenamento local. A plataforma funciona, mas os dados não ficam salvos ao fechar.','erro');
});

</script>
